<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{background-color: black;}
        .body{
            /* background-color: rgb(75, 75, 244); */
            background-color: yellow;
            height:200px;
            width: 300px;
            position:relative;
        }
        .first,.second{
            height: 75px;
            width: 50px ;
            background-color: rgb(75,75,244);
        }
        .second{
            position: absolute;
            bottom: 0px;
        }
            .third,.fourth {
                height: 75px;
                width: 190px;
                 background-color: rgb(75,75,244);  
                 position: absolute;
                 right: 0px;  
            }
            .third{
                bottom: 0px;
            }
            .fourth{
                top: 0px;
            }
        
    </style>
</head>
<body>
    <div class="body">
        <div class="first box"></div>
         <div class="second box"></div>
          <div class="third box"></div>
           <div class="fourth box"></div>

    </div>
</body>
</html>
