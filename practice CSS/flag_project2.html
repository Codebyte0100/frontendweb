<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{padding: 0;
            margin: 0;
        }
        .largebox{
            background-color: rgb(238, 6, 6);
            height: 400px;
            width: 600px;
            position: relative;
        }
        .smallbox{
            background-color: rgb(7, 79, 247);
            height: 200px;
            width: 600px;
            position: absolute;
            bottom: 100px; 
        }
        .circle{
            background-color: white;
            height: 200px;
            width: 200px;
            border-radius: 50%;
            position: absolute;
            left: 200px;
                       padding: 30px;
                       box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="largebox">
        <div class="smallbox">
            <div class="circle">

            </div>
        </div>
    </div>
</body>
</html>
